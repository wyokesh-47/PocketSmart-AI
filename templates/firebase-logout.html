<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Signing out | PocketSmart AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="auth-wrapper">
    <section class="auth-card">
      <h1>Signing out</h1>
      <p class="page-subtitle">Your PocketSmart session is being closed.</p>
      <a href="{{ url_for('login') }}">Continue to login</a>
    </section>
  </main>
  <script type="application/json" id="firebaseWebConfig">{{ firebase_web_config|tojson }}</script>
  <script type="module">
    import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
    import {getAuth, signOut} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
    const config = JSON.parse(document.getElementById('firebaseWebConfig').textContent);
    try {
      if (config.apiKey) await signOut(getAuth(initializeApp(config)));
    } catch (_) {
      // The Flask session is already cleared; the link remains as a fallback.
    } finally {
      window.location.replace('{{ url_for("login") }}');
    }
  </script>
</body>
</html>
