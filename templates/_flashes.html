{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-container" role="status">
      {% for category, message in messages %}
        <div class="flash-message flash-{{ category }}"><i class="fa-solid {{ 'fa-circle-check' if category == 'success' else ('fa-circle-exclamation' if category == 'error' else 'fa-circle-info') }}"></i><span>{{ message }}</span></div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
