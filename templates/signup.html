<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | PocketSmart AI</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">
      <i class="fa-solid fa-wallet" style="color: var(--primary-light);"></i>
      <span>PocketSmart</span>
      <span class="brand-badge">AI</span>
    </a>
    <div class="nav-menu">
      <a href="/login" class="btn btn-outline btn-sm">Log In</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-tabs">
        <a href="/login" class="auth-tab">Log In</a>
        <a href="/signup" class="auth-tab active">Sign Up</a>
      </div>

      <h1 style="font-size: 24px; margin-bottom: 6px;">Create Account 🚀</h1>
      <p class="page-subtitle" style="margin-bottom: 24px;">Start managing your budget with AI assistance.</p>

      {% include '_flashes.html' %}

      <form method="post" action="/signup" {% if firebase_server_ready %}data-firebase-auth="signup"{% endif %}>
        {% if firebase_server_ready %}<div class="flash-message flash-info" data-auth-message hidden></div>{% endif %}
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input class="input" type="text" name="name" value="{{ name or '' }}" placeholder="John Doe" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input class="input" type="email" name="email" value="{{ email or '' }}" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-field"><input class="input" type="password" name="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required><button type="button" class="password-toggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="password-field"><input class="input" type="password" name="confirm_password" placeholder="Re-enter password" minlength="8" autocomplete="new-password" required><button type="button" class="password-toggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </form>

      <p style="text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 24px;">
        Already registered? <a href="/login" style="color: var(--primary-light); font-weight: 600;">Sign in here</a>
      </p>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% if firebase_server_ready %}
    <script id="firebaseWebConfig" type="application/json">{{ firebase_web_config|tojson }}</script>
    <script type="module" src="{{ url_for('static', filename='js/firebase-auth.js') }}"></script>
  {% endif %}
</body>
</html>
